<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>লগইন করুন — টাঙ্গাইল জেলা</title>
<meta name="description" content="আপনার Gmail ও পাসওয়ার্ড দিয়ে টাঙ্গাইল জেলা ওয়েবসাইটে প্রবেশ করুন।">
<meta name="theme-color" content="#0E6B3A">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=20260922203957">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">

<div class="auth-wrap">

  <div class="auth-logo">
    <div class="mark">টঙ</div>
    <div class="mark-sub">TANGAIL ZILA</div>
  </div>

  <div class="auth-card">
    <h1>আপনার একাউন্টে প্রবেশ করুন</h1>

    <div class="auth-field">
      <span class="auth-icon"><i class="fa-solid fa-envelope" aria-hidden="true"></i></span>
      <input type="email" id="emailInput" placeholder="আপনার Gmail লিখুন" autocomplete="username" inputmode="email">
    </div>

    <div class="auth-field">
      <span class="auth-icon"><i class="fa-solid fa-lock" aria-hidden="true"></i></span>
      <input type="password" id="passInput" placeholder="পাসওয়ার্ড লিখুন" autocomplete="current-password">
      <button type="button" class="auth-eye" id="toggleEye" aria-label="পাসওয়ার্ড দেখান"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
    </div>

    <a href="forgot-password.html" class="auth-forgot">পাসওয়ার্ড ভুলে গেছেন?</a>

    <p class="auth-msg" id="authMsg"></p>

    <button type="button" class="auth-btn" id="loginBtn">প্রবেশ করুন</button>

    <a href="register.html" class="auth-btn-outline">নতুন একাউন্ট এখানে <strong>রেজিস্ট্রেশন করুন</strong></a>

    <a href="index.html" class="auth-btn-guest">অতিথি হিসেবে প্রবেশ করুন</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js?v=20260922203957"></script>
    <script src="js/nav-avatar.js?v=20260922203957"></script>
    <script src="js/call.js?v=20260922203957"></script>
<script>
(function () {
  var client = window.supabase.createClient(window.TANGAIL_SUPABASE.url, window.TANGAIL_SUPABASE.key);

  var emailInput = document.getElementById('emailInput');
  var passInput = document.getElementById('passInput');
  var loginBtn = document.getElementById('loginBtn');
  var msg = document.getElementById('authMsg');
  var eyeBtn = document.getElementById('toggleEye');

  eyeBtn.addEventListener('click', function () {
    var showing = passInput.type === 'text';
    passInput.type = showing ? 'password' : 'text';
    eyeBtn.innerHTML = showing ? '<i class="fa-solid fa-eye" aria-hidden="true"></i>' : '<i class="fa-solid fa-eye-slash" aria-hidden="true"></i>';
  });

  function setMsg(text, ok) {
    msg.textContent = text || '';
    msg.className = 'auth-msg' + (ok ? ' ok' : '');
  }

  // লগইনের পর কোথায় ফিরে যেতে হবে (?next=...) — না থাকলে হোমপেজ
  var nextUrl = new URLSearchParams(window.location.search).get('next') || 'index.html';

  // ইতিমধ্যে লগইন করা থাকলে সরাসরি সেই পেজে পাঠানো
  client.auth.getSession().then(function (res) {
    if (res.data && res.data.session) window.location.href = nextUrl;
  });

  function doLogin() {
    var email = emailInput.value.trim();
    var pass = passInput.value;
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setMsg('সঠিক Gmail/ইমেইল ঠিকানা দিন।');
      return;
    }
    if (!pass) {
      setMsg('পাসওয়ার্ড লিখুন।');
      return;
    }
    loginBtn.disabled = true;
    setMsg('প্রবেশ করা হচ্ছে…', true);
    client.auth.signInWithPassword({ email: email, password: pass })
      .then(function (res) {
        loginBtn.disabled = false;
        if (res.error) {
          if (String(res.error.message || '').toLowerCase().indexOf('confirm') !== -1) {
            setMsg('আপনার Gmail এখনো ভেরিফাই করা হয়নি। ইনবক্স চেক করে ভেরিফিকেশন লিংকে ক্লিক করুন।');
          } else {
            setMsg('লগইন ব্যর্থ: Gmail বা পাসওয়ার্ড ভুল।');
          }
          return;
        }
        setMsg('সফলভাবে প্রবেশ করা হয়েছে!', true);
        window.location.href = nextUrl;
      });
  }

  loginBtn.addEventListener('click', doLogin);
  passInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  emailInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') passInput.focus(); });
})();
</script>
<script src="js/auto-update.js?v=20260922203957"></script>
<script src="js/floating-buttons.js?v=20260922203957"></script>
</body>
</html>
