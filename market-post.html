<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পোস্ট করুন — কেনাবেচা — টাঙ্গাইল জেলা</title>
<meta name="description" content="আপনার পণ্য কেনাবেচা বিভাগে পোস্ট করুন — মোবাইল, গাড়ি, বাড়ি/জমি ও আরও অনেক ক্যাটাগরিতে।">
<meta name="theme-color" content="#0E6B3A">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=20260924073609">
<link rel="stylesheet" href="css/buysell.css?v=20260924073609">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-banner-category="buy-sell">

<header class="site-header app-header">
  <div class="header-inner">
    <button class="menu-toggle icon-btn" id="menuToggle" data-i18n-aria="menu.open" aria-label="মেনু খুলুন"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
    <div class="brand-block">
      <a href="index.html" class="brand app-brand">টাঙ্গাইল <span class="brand-accent">জেলা</span></a>
    </div>
    <div class="header-actions">
      <a href="notifications.html" class="icon-btn" data-i18n-aria="menu.notifications" aria-label="বিজ্ঞপ্তি"><i class="fa-solid fa-bell" aria-hidden="true"></i></a>
      <div class="more-menu-wrap">
        <button type="button" class="icon-btn" id="moreMenuToggle" data-i18n-aria="menu.more" aria-label="আরও"><i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i></button>
        <div class="more-menu" id="moreMenu">
          <div class="more-menu-section-title" data-i18n="menu.language">ভাষা</div>
          <div class="lang-switcher">
            <button type="button" class="lang-option" data-lang-choice="bn">বাংলা</button>
            <button type="button" class="lang-option" data-lang-choice="en">English</button>
          </div>
        </div>
      </div>
    </div>
    <nav class="main-nav" id="mainNav">
      <a href="index.html" data-i18n="nav.home">হোম</a>
      <a href="about.html" data-i18n="nav.about">পরিচিতি</a>
      <a href="faq.html" data-i18n="nav.faq">সাধারণ প্রশ্ন</a>
      <a href="contact.html" data-i18n="nav.contact">যোগাযোগ</a>
    </nav>
  </div>
</header>
<main>
  <div class="wrap">

    <div class="bs-topbar">
      <div class="bs-topbar-left">
        <button type="button" class="post-detail-back" onclick="if(window.history.length>1){history.back();}else{window.location.href='buy-sell.html';}" aria-label="পেছনে যান"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
        <span>পোস্ট করুন</span>
      </div>
    </div>

    <form class="contact-form icon-form" id="mpForm">
      <div>
        <label>ছবি (১-৩টি) <span style="color:var(--ink-soft); font-weight:400;">— প্রথম ছবিটি প্রচ্ছদ ছবি হিসেবে দেখানো হবে</span></label>
        <div class="bs-img-picker" id="mpImgPicker"></div>
        <input type="file" id="mpFileInput" accept="image/*" hidden>
      </div>

      <div class="icon-field">
        <i class="fa-solid fa-tag field-icon" aria-hidden="true"></i>
        <label for="mpTitle" class="sr-only">পণ্যের নাম *</label>
        <input type="text" id="mpTitle" placeholder="পণ্যের নাম *">
      </div>

      <div class="icon-field">
        <i class="fa-solid fa-money-bill-wave field-icon" aria-hidden="true"></i>
        <label for="mpPrice" class="sr-only">দাম (টাকা) *</label>
        <input type="number" id="mpPrice" placeholder="দাম (টাকা) *" min="0" inputmode="numeric">
      </div>

      <div class="icon-field icon-field-select">
        <i class="fa-solid fa-list field-icon" aria-hidden="true"></i>
        <label for="mpCategory" class="sr-only">ক্যাটাগরি *</label>
        <select id="mpCategory"></select>
      </div>

      <div class="icon-field icon-field-select">
        <i class="fa-solid fa-map-location-dot field-icon" aria-hidden="true"></i>
        <label for="mpUpazila" class="sr-only">উপজেলা *</label>
        <select id="mpUpazila"></select>
      </div>

      <div class="icon-field">
        <i class="fa-solid fa-mobile-screen field-icon" aria-hidden="true"></i>
        <label for="mpPhone" class="sr-only">মোবাইল নম্বর *</label>
        <input type="tel" id="mpPhone" placeholder="মোবাইল নম্বর *" inputmode="numeric">
      </div>

      <div class="icon-field">
        <i class="fa-solid fa-file-lines field-icon" aria-hidden="true"></i>
        <label for="mpDescription" class="sr-only">বিবরণ *</label>
        <textarea id="mpDescription" placeholder="বিবরণ * — পণ্যের সম্পর্কে বিস্তারিত লিখুন…"></textarea>
      </div>

      <div class="bs-upload-progress-wrap" id="mpProgressWrap" hidden>
        <div class="bs-upload-progress"><div class="bs-upload-progress-bar" id="mpProgressBar"></div></div>
        <span class="bs-upload-progress-text" id="mpProgressText">০%</span>
      </div>
      <p class="auth-msg" id="mpMsg" style="text-align:center;" aria-live="polite"></p>

      <button type="submit" id="mpSubmitBtn">পোস্ট করুন</button>
    </form>

  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html"><span class="bn-icon"><i class="fa-solid fa-house" aria-hidden="true"></i></span><span data-i18n="bottomnav.home">Home</span></a>
  <a href="members.html"><span class="bn-icon"><i class="fa-solid fa-users" aria-hidden="true"></i></span><span data-i18n="bottomnav.members">Members</span></a>

  <a href="profile.html"><span class="bn-icon"><i class="fa-solid fa-user" aria-hidden="true"></i></span><span data-i18n="bottomnav.profile">Profile</span></a>
</nav>

<script src="js/call.js?v=20260924073609"></script>
<script src="js/i18n.js?v=20260924073609"></script>
<script src="js/script.js?v=20260924073609"></script>
<script src="js/market-post.js?v=20260924073609"></script>

</body>
</html>
