<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রক্তদাতা — টাঙ্গাইল জেলা</title>
<meta name="description" content="জরুরি প্রয়োজনে থানা ও রক্তের গ্রুপ অনুযায়ী নিকটস্থ রক্তদাতার সাথে দ্রুত যোগাযোগ করুন।">
<meta property="og:title" content="রক্তদাতা — টাঙ্গাইল জেলা">
<meta property="og:description" content="জরুরি প্রয়োজনে থানা ও রক্তের গ্রুপ অনুযায়ী নিকটস্থ রক্তদাতার তালিকা।">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0E6B3A">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=20260930095736">
<link rel="stylesheet" href="css/blood.css?v=20260930095736">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bd-page" data-bd-mode="donor">

<main>
  <div class="post-detail-topbar list-back-topbar">
    <button type="button" class="post-detail-back" onclick="if(window.history.length>1){history.back();}else{window.location.href='index.html';}" aria-label="পেছনে যান"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
    <span>রক্তদাতা</span>
  </div>

  <div class="wrap bd-wrap">
    <!-- অপশন: রক্তদাতা / রক্তের দরকার (আলাদা পেজ) -->
    <nav class="bd-tabs" aria-label="রক্তদাতা ও রক্তের দরকার">
      <a href="blood-donors.html" class="bd-tab is-active" aria-current="page">রক্তদাতা</a>
      <a href="blood-requests.html" class="bd-tab">রক্তের দরকার</a>
    </nav>

    <!-- থানা ড্রপডাউন (জেলার ১২ থানা) -->
    <section class="bd-filter">
      <label class="bd-filter-label" for="bdThana">থানা নির্বাচন করুন</label>
      <div class="bd-select-wrap">
        <i class="fa-solid fa-location-dot bd-pin" aria-hidden="true"></i>
        <select id="bdThana"></select>
        <i class="fa-solid fa-chevron-down bd-caret" aria-hidden="true"></i>
      </div>
    </section>

    <!-- ব্লাড গ্রুপ চিপ (বামে-ডানে স্ক্রল) -->
    <nav class="bd-chips" aria-label="রক্তের গ্রুপ">
      <div class="bd-chips-scroll" id="bdChips" role="group"></div>
    </nav>

    <!-- রক্তদাতার কার্ড -->
    <section class="donor-list" id="bdList" aria-live="polite"></section>
  </div>
</main>

<!-- ফ্লোটিং + -->
<button type="button" class="bd-fab" id="bdFab" aria-haspopup="dialog" aria-label="রক্তদাতা হিসেবে যোগ করুন"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>

<!-- থানা ও ব্লাড গ্রুপ ভিত্তিক ফর্ম -->
<div class="modal-overlay" id="bdModal">
  <div class="modal-box icon-modal-box" role="dialog" aria-modal="true" aria-labelledby="bdFormTitle">
    <h2 id="bdFormTitle">রক্তদাতা হোন</h2>
    <form class="contact-form icon-form" id="bdForm" novalidate>
      <div class="icon-field icon-field-select">
        <i class="fa-solid fa-building-shield field-icon" aria-hidden="true"></i>
        <label for="bdfThana" class="sr-only">থানা</label>
        <select id="bdfThana"></select>
      </div>
      <div class="icon-field icon-field-select">
        <i class="fa-solid fa-droplet field-icon" aria-hidden="true"></i>
        <label for="bdfGroup" class="sr-only">রক্তের গ্রুপ</label>
        <select id="bdfGroup"></select>
      </div>

      <div id="bdDonorFields">
        <div class="icon-field">
          <i class="fa-solid fa-user field-icon" aria-hidden="true"></i>
          <label for="bdfName" class="sr-only">আপনার নাম</label>
          <input type="text" id="bdfName" maxlength="80" autocomplete="off" placeholder="আপনার নাম">
        </div>
        <div class="icon-field">
          <i class="fa-solid fa-mobile-screen field-icon" aria-hidden="true"></i>
          <label for="bdfPhone" class="sr-only">মোবাইল নাম্বার</label>
          <input type="tel" id="bdfPhone" inputmode="numeric" maxlength="14" autocomplete="off" placeholder="মোবাইল নাম্বার (01XXXXXXXXX)">
        </div>
        <div class="icon-field">
          <i class="fa-solid fa-location-dot field-icon" aria-hidden="true"></i>
          <label for="bdfAddress" class="sr-only">ঠিকানা</label>
          <input type="text" id="bdfAddress" maxlength="200" autocomplete="off" placeholder="ঠিকানা (গ্রাম / এলাকা)">
        </div>
        <div class="icon-field">
          <i class="fa-solid fa-hand-holding-droplet field-icon" aria-hidden="true"></i>
          <label for="bdfTotal" class="sr-only">মোট রক্তদান (বার)</label>
          <input type="number" id="bdfTotal" min="0" step="1" placeholder="মোট রক্তদান (বার) — ঐচ্ছিক">
        </div>
        <div class="icon-field">
          <i class="fa-solid fa-file-lines field-icon" aria-hidden="true"></i>
          <label for="bdfComment" class="sr-only">মন্তব্য</label>
          <input type="text" id="bdfComment" maxlength="200" autocomplete="off" placeholder="মন্তব্য লিখুন (ঐচ্ছিক)">
        </div>
      </div>

      <div class="bd-hp" aria-hidden="true"><input type="text" id="bdHp" tabindex="-1" autocomplete="off"></div>
      <p class="auth-msg" id="bdFormMsg"></p>
      <div class="modal-actions">
        <button type="button" class="modal-cancel" id="bdCancel">বাতিল করুন</button>
        <button type="submit" class="modal-submit" id="bdSubmit">সাবমিট করুন</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js?v=20260930095736"></script>
<script src="js/blood.js?v=20260930095736"></script>
<script src="js/auto-update.js?v=20260930095736"></script>
<script src="js/floating-buttons.js?v=20260930095736"></script>
</body>
</html>
