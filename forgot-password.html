<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পাসওয়ার্ড ভুলে গেছেন — টাঙ্গাইল জেলা</title>
<meta name="theme-color" content="#0E6B3A">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=20260930043823">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">

<div class="auth-wrap">

  <div class="auth-logo">
    <img src="assets/logo/tangail-logo.png" alt="টাঙ্গাইল জেলা" class="auth-logo-img" onload="this.parentNode.classList.add('logo-ok')" onerror="this.remove()">
    <div class="mark">টঙ</div>
    <div class="mark-sub">TANGAIL ZILA</div>
  </div>

  <div class="auth-card">
    <h1>পাসওয়ার্ড রিসেট করুন</h1>

    <div class="auth-field">
      <span class="auth-icon"><i class="fa-solid fa-envelope" aria-hidden="true"></i></span>
      <input type="email" id="emailInput" placeholder="আপনার Gmail লিখুন" inputmode="email">
    </div>

    <p class="auth-msg" id="authMsg"></p>

    <button type="button" class="auth-btn" id="sendBtn">রিসেট লিংক পাঠান</button>

    <a href="login.html" class="auth-btn-outline">মনে পড়েছে? <strong>লগইন করুন</strong></a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js?v=20260930043823"></script>
    <script src="js/nav-avatar.js?v=20260930043823"></script>
    <script src="js/call.js?v=20260930043823"></script>
<script>
(function () {
  var client = window.supabase.createClient(window.TANGAIL_SUPABASE.url, window.TANGAIL_SUPABASE.key);

  var emailInput = document.getElementById('emailInput');
  var sendBtn = document.getElementById('sendBtn');
  var msg = document.getElementById('authMsg');

  function setMsg(text, ok) {
    msg.textContent = text || '';
    msg.className = 'auth-msg' + (ok ? ' ok' : '');
  }

  sendBtn.addEventListener('click', function () {
    var email = emailInput.value.trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setMsg('সঠিক Gmail/ইমেইল ঠিকানা দিন।');
      return;
    }
    sendBtn.disabled = true;
    setMsg('পাঠানো হচ্ছে…', true);
    client.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    }).then(function (res) {
      sendBtn.disabled = false;
      // নিরাপত্তার জন্য Supabase সবসময় একই বার্তা দেখায়, ইমেইলটি রেজিস্টার্ড থাকুক বা না থাকুক
      setMsg('রিসেট লিংক আপনার Gmail এ পাঠানো হয়েছে (স্প্যাম ফোল্ডারও দেখুন)। লিংকে ক্লিক করে নতুন পাসওয়ার্ড দিন।', true);
    });
  });
})();
</script>
<script src="js/auto-update.js?v=20260930043823"></script>
<script src="js/floating-buttons.js?v=20260930043823"></script>
</body>
</html>
