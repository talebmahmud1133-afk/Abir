<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>নতুন পাসওয়ার্ড দিন — টাঙ্গাইল জেলা</title>
<meta name="theme-color" content="#0E6B3A">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=20260924073609">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">

<div class="auth-wrap">

  <div class="auth-logo">
    <div class="mark">টঙ</div>
    <div class="mark-sub">TANGAIL ZILA</div>
  </div>

  <div class="auth-card">
    <h1>নতুন পাসওয়ার্ড সেট করুন</h1>

    <div class="auth-field">
      <span class="auth-icon"><i class="fa-solid fa-lock" aria-hidden="true"></i></span>
      <input type="password" id="passInput" placeholder="নতুন পাসওয়ার্ড দিন (কমপক্ষে ৬ অক্ষর)" autocomplete="new-password">
      <button type="button" class="auth-eye" id="toggleEye1" aria-label="পাসওয়ার্ড দেখান"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
    </div>

    <div class="auth-field">
      <span class="auth-icon"><i class="fa-solid fa-lock" aria-hidden="true"></i></span>
      <input type="password" id="pass2Input" placeholder="পাসওয়ার্ড আবার লিখুন" autocomplete="new-password">
      <button type="button" class="auth-eye" id="toggleEye2" aria-label="পাসওয়ার্ড দেখান"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
    </div>

    <p class="auth-msg" id="authMsg"></p>

    <button type="button" class="auth-btn" id="saveBtn">পাসওয়ার্ড সংরক্ষণ করুন</button>

    <a href="login.html" class="auth-btn-outline">লগইন পেজে ফিরে যান</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js?v=20260924073609"></script>
    <script src="js/nav-avatar.js?v=20260924073609"></script>
    <script src="js/call.js?v=20260924073609"></script>
<script>
(function () {
  var client = window.supabase.createClient(window.TANGAIL_SUPABASE.url, window.TANGAIL_SUPABASE.key);

  var passInput = document.getElementById('passInput');
  var pass2Input = document.getElementById('pass2Input');
  var saveBtn = document.getElementById('saveBtn');
  var msg = document.getElementById('authMsg');
  var ready = false;

  function wireEye(btnId, inputEl) {
    var btn = document.getElementById(btnId);
    btn.addEventListener('click', function () {
      var showing = inputEl.type === 'text';
      inputEl.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? '<i class="fa-solid fa-eye" aria-hidden="true"></i>' : '<i class="fa-solid fa-eye-slash" aria-hidden="true"></i>';
    });
  }
  wireEye('toggleEye1', passInput);
  wireEye('toggleEye2', pass2Input);

  function setMsg(text, ok) {
    msg.textContent = text || '';
    msg.className = 'auth-msg' + (ok ? ' ok' : '');
  }

  // ইমেইলের রিসেট লিংক থেকে এলে Supabase একটি অস্থায়ী "recovery" সেশন তৈরি করে
  client.auth.onAuthStateChange(function (event) {
    if (event === 'PASSWORD_RECOVERY') {
      ready = true;
    }
  });

  client.auth.getSession().then(function (res) {
    if (res.data && res.data.session) ready = true;
    else setMsg('এই লিংকটি সঠিক নয় অথবা মেয়াদ শেষ হয়ে গেছে। আবার রিসেট অনুরোধ করুন।');
  });

  function doSave() {
    var pass = passInput.value;
    var pass2 = pass2Input.value;

    if (!ready) { setMsg('লিংকটি সঠিক নয় অথবা মেয়াদ শেষ হয়ে গেছে। forgot-password.html থেকে আবার চেষ্টা করুন।'); return; }
    if (pass.length < 6) { setMsg('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।'); return; }
    if (pass !== pass2) { setMsg('দুইটি পাসওয়ার্ড মিলছে না।'); return; }

    saveBtn.disabled = true;
    setMsg('সংরক্ষণ করা হচ্ছে…', true);

    client.auth.updateUser({ password: pass }).then(function (res) {
      saveBtn.disabled = false;
      if (res.error) {
        setMsg('পাসওয়ার্ড পরিবর্তন ব্যর্থ হয়েছে, আবার চেষ্টা করুন।');
        return;
      }
      setMsg('পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে! এখন লগইন করুন।', true);
      setTimeout(function () { window.location.href = 'login.html'; }, 1500);
    });
  }

  saveBtn.addEventListener('click', doSave);
  pass2Input.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSave(); });
})();
</script>
<script src="js/auto-update.js?v=20260924073609"></script>
<script src="js/floating-buttons.js?v=20260924073609"></script>
</body>
</html>
